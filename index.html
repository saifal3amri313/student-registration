<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الطلاب</title>

<style>
:root{--bg:#f3f6fb;--card:#fff;--text:#1d2433;--accent:#2563eb;--border:#cbd5e1}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--border:#475569}}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:24px 16px}
.card{background:var(--card);width:100%;max-width:420px;padding:24px;border-radius:14px;box-shadow:0 4px 20px #0002;height:fit-content}
h1{margin:0 0 18px;font-size:22px;text-align:center}
label{display:block;margin:12px 0 4px;font-size:14px}
input{width:100%;box-sizing:border-box;padding:11px;border:1px solid var(--border);border-radius:8px;font-size:16px;background:transparent;color:inherit}
button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-size:17px;cursor:pointer}
button.sec{background:transparent;color:var(--accent);border:1px solid var(--accent);margin-top:10px;font-size:14px}
#msg{margin-top:12px;text-align:center;font-size:14px;min-height:20px}
</style>
</head>
<body>
<div class="card">
  <h1>تسجيل الطلاب</h1>
  <form id="f">
    <label>الاسم الثلاثي</label>
    <input name="name" required placeholder="مثال: أحمد محمد علي" pattern=".*\S+\s+\S+\s+\S+.*" title="اكتب الاسم الثلاثي">
    <label>الصف</label>
    <input name="grade" required placeholder="مثال: الخامس">
    <label>الشعبة</label>
    <input name="section" required placeholder="مثال: أ">
    <label>رقم الموبايل</label>
    <input name="phone" required type="tel" inputmode="numeric" pattern="[0-9+]{9,15}" placeholder="07xxxxxxxxx">
    <button type="submit">تسجيل</button>
  </form>
  <div id="msg"></div>
</div>
<script>
// ضع هنا رابط Google Apps Script (Web app). إذا تركته فارغًا يُرسل للسيرفر /register
const SHEET_URL = "https://script.google.com/macros/s/AKfycbzJdn7viv27xMArE2TKq8wrj2IxlknegUwhf27I9ZdkwSknt7kHvlU69k4dVPkANiCRwA/exec";
const msg = (t, ok = true) => { const m = document.getElementById("msg"); m.textContent = t; m.style.color = ok ? "#16a34a" : "#dc2626"; };
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = e.target.querySelector("button"); btn.disabled = true;
  try {
    const body = JSON.stringify(Object.fromEntries(new FormData(e.target)));
    if (SHEET_URL) await fetch(SHEET_URL, { method: "POST", mode: "no-cors", body });
    else if (!(await fetch("/register", { method: "POST", body })).ok) throw 0;
    e.target.reset(); msg("تم التسجيل بنجاح ✔");
  } catch { msg("تعذر التسجيل، حاول مرة أخرى", false); }
  btn.disabled = false;
});
</script>
</body>
</html>
