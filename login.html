<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بيانات الدخول | مدرسة حضارة أوروك للبنين</title>
<style>
:root{--navy:#14284b;--navy2:#1f3d73;--gold:#c9a24b;--bg:#f2f4f8;--card:#fff;--text:#1c2433;--muted:#64708a;--line:#d6dce8;--err:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#0d1526;--card:#16213a;--text:#e6ebf5;--muted:#9aa7c2;--line:#2c3a59;--navy:#0b1730;--navy2:#1b3263}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;text-align:center;padding:34px 16px 62px;border-bottom:4px solid var(--gold)}
.logo{width:68px;height:68px;margin:0 auto 12px;border-radius:50%;background:#ffffff1a;border:2px solid var(--gold);display:grid;place-items:center;font-size:32px}
header h1{margin:0;font-size:24px;font-weight:700}
header p{margin:6px 0 0;color:#cfd8ec;font-size:14px}
main{max-width:440px;margin:-40px auto 32px;padding:0 16px}
.card{background:var(--card);border-radius:16px;padding:24px;box-shadow:0 10px 30px #0f1e4126;border:1px solid var(--line)}
.card h2{margin:0 0 4px;font-size:18px}
.sub{margin:0 0 16px;color:var(--muted);font-size:13.5px}
label{display:block;margin:14px 0 6px;font-size:14px;font-weight:600}
input{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:16px;background:transparent;color:inherit;font-family:inherit}
input:focus{outline:none;border-color:var(--navy2);box-shadow:0 0 0 3px #1f3d7326}
.btn{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:var(--navy2);color:#fff;font-size:17px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.6;cursor:wait}
#err{display:none;margin-top:14px;padding:11px 13px;border-radius:10px;background:#b4231612;color:var(--err);font-size:14px;border:1px solid #b4231633}
.acc{margin-top:18px;border:1.5px solid var(--gold);border-radius:12px;padding:14px;background:#c9a24b10}
.acc h3{margin:0 0 2px;font-size:15px}
.acc small{color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:9px}
.row span{color:var(--muted);font-size:13px}
.row b{font-family:Consolas,monospace;font-size:17px;direction:ltr;word-break:break-all}
.copy{border:0;background:var(--line);color:inherit;border-radius:7px;padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit}
.note{margin-top:14px;font-size:12.5px;color:var(--muted);line-height:1.7}
footer{text-align:center;color:var(--muted);font-size:12.5px;padding-bottom:24px}
</style>
</head>
<body>
<header>
  <div class="logo">🎓</div>
  <h1>مدرسة حضارة أوروك للبنين</h1>
  <p>بوابة استعلام بيانات الدخول</p>
</header>
<main>
  <div class="card">
    <h2>أهلًا بك عزيزي الطالب</h2>
    <p class="sub">اكتب اسمك الثلاثي ورقم الموبايل الذي سجّلته لدينا لتظهر لك بيانات دخولك.</p>
    <form id="f" autocomplete="off">
      <label for="name">الاسم الثلاثي</label>
      <input id="name" required placeholder="مثال: أحمد محمد علي">
      <label for="phone">رقم الموبايل</label>
      <input id="phone" required type="tel" inputmode="numeric" placeholder="07xxxxxxxxx" maxlength="14" dir="ltr" style="text-align:right">
      <button class="btn" id="go" type="submit">عرض بيانات الدخول</button>
    </form>
    <div id="err"></div>
    <div id="res"></div>
    <p class="note">🔒 لا تشارك بيانات دخولك مع أي شخص. تُسجَّل عمليات الاستعلام لحماية الحسابات.</p>
  </div>
</main>
<footer>© إدارة مدرسة حضارة أوروك للبنين</footer>
<script>
// رابط Google Apps Script (lookup-script.gs) بعد النشر كـ Web app
const LOOKUP_URL = "";
const $ = id => document.getElementById(id);
const MSG = {
  invalid: "تأكد من كتابة الاسم الثلاثي ورقم موبايل صحيح (07xxxxxxxxx).",
  notfound: "لم نجد تطابقًا. تأكد من الاسم والرقم المسجَّل لدينا، أو راجع إدارة المدرسة.",
  locked: "تم إيقاف المحاولات مؤقتًا بسبب كثرة المحاولات الخاطئة. حاول بعد 15 دقيقة."
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function showErr(t) { const e = $("err"); e.textContent = t; e.style.display = "block"; }
$("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  $("err").style.display = "none"; $("res").innerHTML = "";
  if (!LOOKUP_URL) return showErr("الخدمة غير مفعّلة بعد.");
  const btn = $("go"); btn.disabled = true; btn.textContent = "جارٍ البحث…";
  try {
    const r = await fetch(LOOKUP_URL, { method: "POST", body: JSON.stringify({ name: $("name").value, phone: $("phone").value }) });
    const d = await r.json();
    if (!d.ok) showErr(MSG[d.error] || "حدث خطأ، حاول مرة أخرى.");
    else $("res").innerHTML = d.accounts.map(a => `
      <div class="acc"><h3>${esc(a.name)}</h3><small>${esc(a.grade)}</small>
        <div class="row"><span>اليوزر</span><b>${esc(a.user)}</b><button class="copy" data-v="${esc(a.user)}">نسخ</button></div>
        <div class="row"><span>الباسورد</span><b>${esc(a.pass)}</b><button class="copy" data-v="${esc(a.pass)}">نسخ</button></div>
      </div>`).join("");
  } catch { showErr("تعذر الاتصال. تحقق من الإنترنت وحاول مرة أخرى."); }
  btn.disabled = false; btn.textContent = "عرض بيانات الدخول";
});
$("res").addEventListener("click", e => {
  const b = e.target.closest(".copy"); if (!b) return;
  navigator.clipboard?.writeText(b.dataset.v).then(() => { b.textContent = "تم ✔"; setTimeout(() => b.textContent = "نسخ", 1500); });
});
</script>
</body>
</html>
